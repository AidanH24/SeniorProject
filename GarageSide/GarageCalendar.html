<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointment Calendar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        .container {
            display: flex;
            width: 100%;
        }

        .left, .right {
            padding: 20px;
        }

        .left {
            width: 60%;
        }

        .right {
            width: 40%;
            border-left: 2px solid #ddd;
        }

        .month-title {
            text-align: center;
            font-size: 40px;
            margin-bottom: 15px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #f5f5f5;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day-header {
            padding: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            background: #f5f5f5;
            border-radius: 5px;
        }

        .day {
            padding: 25px;
            border: 1px solid #ccc;
            text-align: center;
            font-size: 25px;
            cursor: pointer;
            border-radius: 5px;
        }

            .day.today {
                border: 3px solid #333;
            }

            .day.selected {
                background-color: #6fa8dc;
                color: white;
            }

        .appointment {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 30px;
        }

        .unfinished {
            background-color: #9fc5e8;
        }

        .finished {
            background-color: #b07d2c;
            color: white;
        }

        .details {
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            font-size: 20px;
        }

        button {
            padding: 16px 24px;
            margin-right: 12px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
        }

        .btn-finish {
            background-color: #b07d2c;
            color: white;
        }

        .btn-reschedule {
            background-color: #6fa8dc;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="month-title" id="monthTitle"></div>
            <div class="calendar" id="calendar"></div>
        </div>

        <div class="right">
            <div id="appointments"></div>
            <div class="details" id="details" style="display:none;"></div>
        </div>
    </div>

    <script src="GarageCalendar.js"></script>
</body>
</html>
