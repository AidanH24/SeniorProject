<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Confirmation</title>
    <link rel="stylesheet" href="conformationPage.css">
</head>

<body>

    <div class="header">
        <div class="logo">Logo</div>
        <div class="title">Avon Gas & Service</div>
    </div>

    <div class="confirm-container">

        <h2>Confirmation</h2>

        <div class="section">
            <p><span class="label">Name:</span> <span id="name"></span></p>
            <p><span class="label">Phone:</span> <span id="phone"></span></p>
        </div>

        <div class="section">
            <p><span class="label">Vehicle Make:</span> <span id="vehicleMake"></span></p>
            <p><span class="label">Vehicle Type:</span> <span id="vehicleType"></span></p>
            <p><span class="label">Vehicle Color:</span> <span id="vehicleColor"></span></p>
            <p><span class="label">Vehicle Year:</span> <span id="vehicleYear"></span></p>
        </div>

        <div class="section">
            <p><span class="label">Selected Services:</span> <span id="services"></span></p>
        </div>

        <div class="section">
            <p><span class="label">Date:</span> <span id="date"></span></p>
            <p><span class="label">Time:</span> <span id="time"></span></p>
        </div>

        <div class="button-row">
            <button onclick="finish()">OK</button>
            <button onclick="window.print()">Print</button>
        </div>

    </div>

    <script src="./confirmationScript/confirmationScript.js"></script>
</body>

</html>
