<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Avon Gas & Service Form</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <div class="header">
        <div class="logo">Logo</div>
        <div class="title">Avon Gas & Service</div>
    </div>

    <div class="form-container">
        <form id="aboutForm"><!--Don't Change This Id-->
            <label>First Name: *</label>
            <input id="firstName" type="text" required>

            <label>Last Name: *</label>
            <input id="lastName" type="text" required>

            <label>Phone Number: *</label>
            <input type="text" id="phone" maxlength="12" placeholder="123-456-7890" inputmode="numeric" required>

            <label>Email: <span class="optional">(Optional)</span></label>
            <input id="email" type="email">

            <div class="btn-container">
                <button type="submit" id="nextBtn">Vehicle Information</button>
            </div>
        </form>
    </div>

    <script type="module" src="/js/script.js"></script>
</body>

</html>
