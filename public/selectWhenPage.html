
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/selectWhenStyleSheet.css" />
    <title>Select When</title>
</head>

<body>
    <div class="header">
        <div class="logo">Logo</div>
        <div class="title">Avon Gas & Service</div>
    </div>

    <div class="form-container">
        <form id="selectWhenForm">

            <div class="field">
                <label for="monthSelect">Month: </label>
                <select id="monthSelect" aria-label="Month"></select>
            </div>

            <div class="field">
                <label for="daySelect">Day: </label>
                <select id="daySelect" aria-label="Day"></select>
            </div>

            <div class="field">
                <label for="timeSelect">Time: </label>
                <select id="timeSelect" size="10" aria-label="Time" style="width: 150px;"></select>
            </div>

            <div class="btn-container">
                <button type="back" id="backBtn">Services</button>
                <button type="submit" id="confirmBtn">Confirm Selection</button>
            </div>
        </form>
    </div>
    <div id="summary" role="status" aria-live="polite"></div>

    <script src="/js/selectWhenPage.js"></script>
    <script src="/js/script.js"></script>

</body>

</html>
