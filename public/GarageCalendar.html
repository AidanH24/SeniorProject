<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointment Calendar</title>
    <link rel="stylesheet" href="css/garageCalendarStyleSheet.css" />
</head>
<body>
    <div class="container">
        <div class="left">

            <div class="month-nav">
                <button id="prevMonth" class="nav-btn">◀ Prev</button>
                <button id="nextMonth" class="nav-btn">Next ▶</button>
            </div>
        
            <div class="month-title" id="monthTitle"></div>
        
            <div class="calendar" id="calendar"></div>
        </div>
        

        <div class="right">
            <div id="appointments"></div>
            <div class="details" id="details" style="display:none;"></div>
        </div>
    </div>
    <script src="/js/garageSide/garageCalender.js"></script>
</body>
</html>
